# Quality gate for every push and PR. Deploy (deploy.yml) only proves the
# build compiles; this proves the standards hold: lint, strict type
# coverage (≥ 99.7% non-`any` identifiers), the unit suite with its line-
# coverage floor, and a clean audit of the dependencies that ship to
# users. `npm audit` is scoped to prod deps so a low-severity advisory in a
# transitive dev tool can't flake the gate — dev-dep hygiene is a
# maintainer task, not a merge blocker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Single source of truth for the Node version — the same file
          # `nvm use` reads locally, so CI and dev can't drift.
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run typecheck:coverage
      - run: npm run test:coverage
      - run: npm audit --omit=dev

      # Full-bundle proof last — `npm run build` re-runs `tsc -b` and the
      # SPA-fallback step, so a packaging regression fails here.
      - run: npm run build
